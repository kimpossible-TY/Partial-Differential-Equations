# ==============================================================================
# Project NightWatch — CI/CD Pipeline
# PR이 열릴 때마다 자동으로 검증 게이트 실행.
# 실패 시 자율 수정(Self-Healing) 및 Discord 알림 전송.
# ==============================================================================

name: NightWatch CI

on:
  pull_request:
    branches: [main]
  # 야간 자율 루프에서 수동으로도 트리거 가능
  workflow_dispatch:

jobs:
  verify:
    name: Verification Gate
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 히스토리를 확인하여 시도 횟수를 체크해야 하므로 전체 체크아웃

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 검증 도구 설치
          pip install pytest pytest-cov mypy flake8 requests

      # 4. Typst 설치
      - name: Install Typst
        run: |
          curl -L -o typst.tar.xz \
            https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # 5. Typst 컴파일 가능 여부 확인
      - name: Typst compilation check
        run: |
          typst compile Typst_project/main.typ /tmp/output.pdf || {
            echo "::error::Typst 컴파일 실패"
            exit 1
          }
          echo "✔ Typst 컴파일 성공"

      # 6. pytest (test/ 디렉터리가 있을 때만)
      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ "$(find tests -name '*.py' | wc -l)" -gt 0 ]; then
            pytest tests/ -v --tb=short
          else
            echo "ℹ️ tests/ 디렉터리에 Python 테스트 없음 — 스킵"
          fi

      # 7. Python 린팅 (Tools/ 디렉터리)
      - name: flake8 lint (Tools/)
        run: |
          if [ -d "Tools" ]; then
            flake8 Tools/ --max-line-length=120 --ignore=E501
          else
            echo "ℹ️ Tools/ 없음 — 스킵"
          fi

      # 8. mypy 타입 체크 (Tools/)
      - name: mypy type check (Tools/)
        run: |
          if [ -d "Tools" ]; then
            mypy Tools/ --ignore-missing-imports || true
          else
            echo "ℹ️ Tools/ 없음 — 스킵"
          fi

      # 9. 실패 시 자율 수정 (Self-Healing)
      - name: Self-healing CI fix
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 실패 로그 캡처 (gh run view를 사용하여 로그 캡처 시도)
          gh run view ${{ github.run_id }} --log | tail -n 200 > failure.log || echo "로그 캡처 실패" > failure.log
          
          # 오케스트레이터 실행 (ci-fixer 에이전트 호출)
          python3 scripts/ci_fix_orchestrator.py failure.log

      # 10. 실패 시 Discord 알림
      - name: Discord failure notification
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          BRANCH="${{ github.head_ref }}"
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚨 **NightWatch CI 실패 및 자율 수정 시도**\n→ 브랜치: \`${BRANCH}\`\n→ PR: ${PR_URL}\n→ 수정 결과는 다음 CI 실행을 확인해주세요.\"
            }"
