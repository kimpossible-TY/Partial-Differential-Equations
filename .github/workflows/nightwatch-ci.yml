# ==============================================================================
# Project NightWatch — CI/CD Pipeline
# PR이 열릴 때마다 자동으로 검증 게이트 실행.
# 실패 시 자율 수정(Self-Healing) 및 Discord 알림 전송.
# ==============================================================================

name: NightWatch CI

on:
  pull_request:
    branches: [main]
  # 야간 자율 루프에서 수동으로도 트리거 가능
  workflow_dispatch:

jobs:
  verify:
    name: Verification Gate
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 자율 수정 커밋 및 푸시용
      pull-requests: write  # PR 관련 작업용 (필요 시)
      actions: read        # GitHub API 접근용

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }} # PAT가 있으면 사용 (연쇄 트리거용)
          fetch-depth: 0

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov mypy flake8 requests

      # 4. Typst 설치
      - name: Install Typst
        run: |
          curl -L -o typst.tar.xz \
            https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # 5. Typst 컴파일 확인
      - name: Typst compilation check
        shell: bash
        run: |
          set -o pipefail
          typst compile Typst_project/main.typ /tmp/output.pdf 2>&1 | tee -a failure.log

      # 6. pytest 실행
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          # 루트 디렉토리의 테스트 파일만 실행
          pytest test_math.py -v --tb=short 2>&1 | tee -a failure.log

      # 7. Python 린팅 (Tools/)
      - name: flake8 lint (Tools/)
        shell: bash
        run: |
          set -o pipefail
          if [ -d "Tools" ]; then
            flake8 Tools/ --max-line-length=120 --ignore=E501 2>&1 | tee -a failure.log
          fi

      # 8. mypy 타입 체크 (Tools/)
      - name: mypy type check (Tools/)
        shell: bash
        run: |
          set -o pipefail
          if [ -d "Tools" ]; then
            mypy Tools/ --ignore-missing-imports 2>&1 | tee -a failure.log || true
          fi

      # 9. 실패 시 자율 수정 (Self-Healing)
      - name: Self-healing CI fix
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 오케스트레이터 실행 (ci-fixer 에이전트 호출)
          python3 scripts/ci_fix_orchestrator.py failure.log

      # 10. 실패 시 Discord 알림
      - name: Discord failure notification
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          BRANCH="${{ github.head_ref }}"
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚨 **NightWatch CI 실패 및 자율 수정 시도**\n→ 브랜치: \`${BRANCH}\`\n→ PR: ${PR_URL}\n→ 수정 결과는 다음 CI 실행을 확인해주세요.\"
            }"
