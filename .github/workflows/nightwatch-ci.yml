# ==============================================================================
# Project NightWatch — CI/CD Pipeline
# PR이 열릴 때마다 자동으로 검증 게이트 실행.
# 실패 시 자율 수정(Self-Healing) 및 Discord 알림 전송.
# ==============================================================================

name: NightWatch CI

on:
  pull_request:
    branches: [main]
  # 야간 자율 루프에서 수동으로도 트리거 가능
  workflow_dispatch:

jobs:
  verify:
    name: Verification Gate
    runs-on: self-hosted
    permissions:
      contents: write       # 자율 수정 커밋 및 푸시용
      pull-requests: write  # PR 관련 작업용 (필요 시)
      actions: read        # GitHub API 접근용

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 다시 GH_PAT를 사용하여 체크가 사라지지 않게 합니다.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Python 환경 설정 (Self-hosted 환경의 Python 사용)
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov mypy flake8 requests autopep8

      # 4. Typst 설치
      - name: Install Typst
        run: |
          curl -L -o typst.tar.xz \
            https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
          # 💥 설치 후 남은 찌꺼기 파일들 삭제 (푸시 방지)
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl

      # 5. 종합 검증 (pytest, flake8, mypy 결과를 모두 failure.log에 수집)
      - name: Run Comprehensive Diagnostics
        shell: bash
        run: |
          EXIT_CODE=0
          
          echo "### 1. Typst Compilation Check ###" | tee -a failure.log
          typst compile Typst_project/main.typ /tmp/output.pdf 2>&1 | tee -a failure.log || EXIT_CODE=1
          
          echo -e "\n### 2. Pytest Execution ###" | tee -a failure.log
          pytest test_math.py -v --tb=short 2>&1 | tee -a failure.log || EXIT_CODE=1
          
          echo -e "\n### 3. Flake8 Linting ###" | tee -a failure.log
          flake8 . --max-line-length=120 --ignore=E501 --exclude=.git,__pycache__ 2>&1 | tee -a failure.log || EXIT_CODE=1
          
          echo -e "\n### 4. Mypy Type Check ###" | tee -a failure.log
          mypy . --ignore-missing-imports --exclude ".git|__pycache__|tests|Typst_project" 2>&1 | tee -a failure.log || EXIT_CODE=1
          
          exit $EXIT_CODE

      # 9. 실패 시 자율 수정 (Self-Healing)
      - name: Self-healing CI fix
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 오케스트레이터 실행
          export PYTHONPATH=$PYTHONPATH:$(pwd)/Tools
          python3 scripts/ci_fix_orchestrator.py failure.log
