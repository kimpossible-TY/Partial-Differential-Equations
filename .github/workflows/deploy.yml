name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # runs on push to main branch
  workflow_dispatch:     # allows manual trigger from actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Local Typst Packages
        uses: actions/checkout@v4
        with:
          repository: kimpossible-TY/typst-packages
          path: typst-packages

      - name: Install Local Typst Packages
        run: |
          # Typst resolves @local packages from this directory on Linux.
          mkdir -p "$HOME/.local/share/typst/packages"
          cp -R typst-packages/local "$HOME/.local/share/typst/packages/"

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'v0.14.2'  # upgraded version to support @preview/mannot:0.3.3

      - name: Generate Build Metadata
        run: |
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PDF_BUILD_AT=${BUILD_AT}" >> "$GITHUB_ENV"
          cat > build-info.typ <<EOF
          #let document-version = "${GITHUB_SHA::7}"
          #let document-built-at = "${BUILD_AT}"
          #let document-latest-url = "https://kimpossible-ty.github.io/Partial-Differential-Equations/"
          #let document-version-check-url = "https://kimpossible-ty.github.io/Partial-Differential-Equations/?pdfBuiltAt=${BUILD_AT}&pdfCommit=${GITHUB_SHA}"
          #let document-pdf-url = "https://kimpossible-ty.github.io/Partial-Differential-Equations/main.pdf"
          #let document-source-url = "https://github.com/kimpossible-TY/Partial-Differential-Equations/tree/${GITHUB_SHA}"
          EOF

      - name: Compile Typst Document
        run: |
          # Compiles main.typ using the local fonts folder
          typst compile main.typ main.pdf --font-path ./fonts

      - name: Generate Published Version Metadata
        run: |
          cat > version.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "builtAt": "${PDF_BUILD_AT}",
            "pdfSha256": "$(sha256sum main.pdf | cut -d ' ' -f1)",
            "pdfSize": $(wc -c < main.pdf)
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Web Artifacts Directory
        run: |
          # Create a deployment directory and copy required static assets
          mkdir -p _site
          cp main.pdf _site/
          cp index.html _site/
          cp version.json _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
