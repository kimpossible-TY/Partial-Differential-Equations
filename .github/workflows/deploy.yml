name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # runs on push to main branch
  workflow_dispatch:     # allows manual trigger from actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Local Typst Packages
        uses: actions/checkout@v4
        with:
          repository: kimpossible-TY/typst-packages
          path: typst-packages

      - name: Install Local Typst Packages
        run: |
          # Typst resolves @local packages from this directory on Linux.
          mkdir -p "$HOME/.local/share/typst/packages"
          cp -R typst-packages/local "$HOME/.local/share/typst/packages/"

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'v0.14.2'  # upgraded version to support @preview/mannot:0.3.3

      - name: Generate Build Metadata
        run: |
          PDF_BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PDF_BUILD_AT=${PDF_BUILD_AT}" >> "$GITHUB_ENV"
          python3 typst-packages/tools/pdf-versioning/pdf_version_server.py --root . --write-version-once

      - name: Compile Typst Document
        run: |
          # Compiles main.typ using the local fonts folder
          typst compile main.typ main.pdf --font-path ./fonts

      - name: Generate Published Version Metadata
        run: python3 typst-packages/tools/pdf-versioning/pdf_version_server.py --root . --write-version-once

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Web Artifacts Directory
        run: |
          # Create a deployment directory and copy required static assets
          mkdir -p _site
          cp main.pdf _site/
          cp index.html _site/
          cp version.json _site/
          cp typst-packages/tools/pdf-versioning/pdf-version-check.js _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
