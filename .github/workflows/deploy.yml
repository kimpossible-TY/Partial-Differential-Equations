name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # runs on push to main branch
  workflow_dispatch:     # allows manual trigger from actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PROJECT_REFERENCE_CATALOG_SHA256: a3a8eda7035aa12e16dad6cc252cb9c6779adcb9f62436e32089cf75340b53fb
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Local Typst Packages
        uses: actions/checkout@v4
        with:
          repository: kimpossible-TY/typst-packages
          ref: 6deccaeb3726335ce6012b2858b33ab33e55aee7
          path: typst-packages

      - name: Install Local Typst Packages
        run: |
          package_root="$RUNNER_TEMP/typst-packages"
          mkdir -p "$package_root"
          cp -R typst-packages/local "$package_root/"
          echo "TYPST_PACKAGE_PATH=$package_root" >> "$GITHUB_ENV"
          echo "TYPST_PACKAGE_CACHE_PATH=$RUNNER_TEMP/typst-cache" >> "$GITHUB_ENV"
          git -C typst-packages rev-parse HEAD

      - name: Install Reference Validation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-venv fonts-noto-cjk
          python3 -m venv "$RUNNER_TEMP/reference-verify"
          "$RUNNER_TEMP/reference-verify/bin/python" -m pip install --disable-pip-version-check pypdf==6.10.0

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'v0.15.0'

      - name: Verify Published Reference Catalog
        run: |
          "$RUNNER_TEMP/reference-verify/bin/python" typst-packages/tools/project-references/verify_references.py \
            --catalog "$TYPST_PACKAGE_PATH/local/project-references/0.1.0/projects.json" \
            --catalog-sha256 "$PROJECT_REFERENCE_CATALOG_SHA256" \
            --source-root . \
            --published-dir "$RUNNER_TEMP/reference-pdfs"

      - name: Generate Build Metadata
        run: |
          PDF_BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PDF_BUILD_AT=${PDF_BUILD_AT}" >> "$GITHUB_ENV"
          python3 typst-packages/tools/pdf-versioning/pdf_version_server.py --root . --write-version-once

      - name: Compile Typst Document
        run: |
          # Compiles main.typ using the local fonts folder
          typst compile main.typ main.pdf --font-path ./fonts

      - name: Verify Compiled Reference Text and Links
        run: |
          "$RUNNER_TEMP/reference-verify/bin/python" typst-packages/tools/project-references/verify_references.py \
            --catalog "$TYPST_PACKAGE_PATH/local/project-references/0.1.0/projects.json" \
            --catalog-sha256 "$PROJECT_REFERENCE_CATALOG_SHA256" \
            --source-root . \
            --published-dir "$RUNNER_TEMP/reference-pdfs" \
            --consumer-pdf main.pdf

      - name: Generate Published Version Metadata
        run: python3 typst-packages/tools/pdf-versioning/pdf_version_server.py --root . --write-version-once

      - name: Export Published Project References
        run: |
          python3 typst-packages/tools/project-references/export_references.py main.typ \
            --project pde \
            --title "Partial Differential Equations" \
            --pdf-url https://kimpossible-ty.github.io/Partial-Differential-Equations/main.pdf \
            --font-path fonts \
            --catalog project-references.json

      - name: Generate Note Statistics
        run: python3 tools/generate_statistics.py --output-dir .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Web Artifacts Directory
        run: |
          # Create a deployment directory and copy required static assets
          mkdir -p _site
          cp main.pdf _site/
          cp index.html _site/
          cp site.css _site/
          cp statistics.html _site/
          cp -R statistics-assets _site/
          cp version.json _site/
          cp project-references.json _site/
          cp typst-packages/tools/pdf-versioning/pdf-version-check.js _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
