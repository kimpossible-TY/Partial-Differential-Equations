# ==============================================================================
# Project NightWatch — 야간 자율 실행 루프
# GitHub Actions schedule로 매일 KST 01:00 (UTC 16:00)에 실행.
# TASKS.md를 파싱 → 브랜치 생성 → 코드 구현(컨테이너) → PR 제출 → CI 결과 확인.
# ==============================================================================

name: NightWatch Autonomous Loop

on:
  schedule:
    - cron: "0 16 * * *"   # KST 01:00 (UTC 16:00)
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Target branch name'
        required: false
        default: ''

jobs:
  nightwatch-loop:
    name: Autonomous Task Execution
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 브랜치 생성 및 파일 수정
      pull-requests: write  # PR 생성
      issues: read
      packages: read        # GHCR에서 이미지 가져오기

    steps:
      # 1. 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # GITHUB_TOKEN 대신 PAT 사용 (PR 트리거를 위해)
          fetch-depth: 0

      # 2. Python 환경 & 도구 설치
      - name: Set up Python + tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # 3. TASKS.md 파싱 — 다음 태스크 추출
      - name: Parse next task
        id: parse
        run: |
          TASK_JSON=$(python3 Tools/task_runner.py --json 2>/dev/null)
          if [ -z "$TASK_JSON" ] || echo "$TASK_JSON" | grep -q "모든 태스크가 완료"; then
            echo "no_task=true" >> $GITHUB_OUTPUT
            echo "🎉 TASKS.md에 미완료 태스크 없음. 루프 종료."
            exit 0
          fi
          echo "task_json=$TASK_JSON" >> $GITHUB_OUTPUT
          # 태스크 본문을 파일로 저장 (이스케이프 문제 방지)
          echo "$TASK_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["body"])' > task_body.txt
          echo "tag=$(echo $TASK_JSON | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag"])')" >> $GITHUB_OUTPUT
          echo "title=$(echo $TASK_JSON | python3 -c 'import sys,json; print(json.load(sys.stdin)["title"])')" >> $GITHUB_OUTPUT
          echo "model=$(echo $TASK_JSON | python3 -c 'import sys,json; print(json.load(sys.stdin)["model"])')" >> $GITHUB_OUTPUT

      # 4. 태스크 없으면 종료
      - name: Skip if no task
        if: steps.parse.outputs.no_task == 'true'
        run: echo "태스크 없음. 종료." && exit 0

      # 5. 작업 브랜치 설정/생성
      - name: Setup task branch
        if: steps.parse.outputs.no_task != 'true'
        run: |
          # 1. 입력값이 있으면 사용, 없으면 제목 기반 생성
          INPUT_BRANCH="${{ github.event.inputs.branch_name }}"
          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH_NAME="$INPUT_BRANCH"
          else
            BRANCH_NAME="nightwatch/$(echo '${{ steps.parse.outputs.title }}' | tr ' ' '-' | tr -cd '[:alnum:]-' | cut -c1-50 | tr '[:upper:]' '[:lower:]')"
          fi
          
          git config user.name "NightWatch Bot"
          git config user.email "nightwatch@kimpossible-ty"
          
          # 2. 이미 해당 브랜치에 있거나 존재하는 경우 처리 (-B는 강제 생성/리셋)
          git checkout -B "$BRANCH_NAME"
          
          echo "branch=$BRANCH_NAME" >> $GITHUB_ENV
          echo "🌿 작업 브랜치 설정 완료: $BRANCH_NAME"

      # 6. 컨테이너 이미지 가져오기 (GHCR 최적화)
      - name: Log in to the Container registry
        if: steps.parse.outputs.no_task != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull NightWatch Agent Images
        if: steps.parse.outputs.no_task != 'true'
        run: |
          docker pull ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
          docker compose pull

      # 7. OpenClaw로 태스크 수행 (Docker Sandbox)
      - name: Execute task (OpenClaw inside Sandbox)
        if: steps.parse.outputs.no_task != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          TITLE="${{ steps.parse.outputs.title }}"
          TASK_BODY=$(cat task_body.txt)

          if [ "$TAG" = "PRO" ]; then
            echo "🧠 [PRO] 태스크: Architecture_Plan.md 생성 후 대기"
            cat > Architecture_Plan.md << EOF
          # Architecture Plan: $TITLE

          ## 태스크 설명
          $TASK_BODY

          ## 제안 설계
          > 이 파일을 인간이 검토하고 PR을 Approve하면 다음 야간 사이클에서 구현됩니다.

          ## 작성일
          $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
            git add Architecture_Plan.md
            git commit -m "plan: [PRO] $TITLE"
          else
            echo "⚡ [FLASH] 태스크: OpenClaw 실행 (Sandbox)"
            # 1. 공용 설정 및 에이전트 초기화 (Dual-Layer Bootstrap)
            mkdir -p ./.openclaw_config
            chmod 777 ./.openclaw_config
            
            # 기초 구조 및 보안 승인 (OpenClaw Onboard - Dual-Layer Part 1)
            docker compose run --rm -T \
              nightwatch-agent \
              openclaw onboard --accept-risk --non-interactive --workspace /workspace \
              --secret-input-mode ref --auth-choice gemini-api-key \
              --mode remote --remote-url ws://openclaw-gateway:18789 || echo "Onboard command failed, relying on Silent Injection fallback"
            
            # Python으로 정밀 주입 및 스키마 보정 (OpenClaw Injection - Dual-Layer Part 2)
            docker compose run --rm -T \
              nightwatch-agent \
              python3 -c "import json, os; path = '/root/.openclaw/openclaw.json'; config = json.load(open(path)) if os.path.exists(path) else {}; config['gateway'] = {'remote': {'url': 'ws://openclaw-gateway:18789'}}; config.setdefault('models', {})['providers'] = {'google': {'baseUrl': 'https://generativelanguage.googleapis.com/v1beta', 'apiKey': '${GEMINI_API_KEY}', 'models': [{'id': 'gemini-1.5-flash', 'name': 'Gemini 1.5 Flash'}, {'id': 'gemini-2.0-flash', 'name': 'Gemini 2.0 Flash'}, {'id': 'gemini-3.0-flash', 'name': 'Gemini 3.0 Flash'}]}}; json.dump(config, open(path, 'w'), indent=2)"
            
            # 에이전트 등록
            docker compose run --rm -T \
              nightwatch-agent \
              openclaw agents add tool-architect --agent-dir /workspace/agents/tool-architect --workspace /workspace --non-interactive
            
            # 2. Gateway 서비스 시작
            docker compose up -d openclaw-gateway
            sleep 5
            
            # 3. Docker 컨테이너 내에서 OpenClaw 실행
            docker compose run --rm -T \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              -e "TASK_BODY=$TASK_BODY" \
              -e OPENCLAW_ACCEPT_RISK=true \
              nightwatch-agent \
              openclaw agent --agent tool-architect --message "$TASK_BODY"
            
            # 4. Gateway 중지
            docker compose stop openclaw-gateway
            
            # 컨테이너에서 생성/수정한 파일 권한 복구 (root -> runner)
            sudo chown -R $USER:$USER .
            
            # 변경 사항 확인 및 커밋
            git add .
            if ! git diff --cached --quiet; then
              git commit -m "feat: [FLASH] $TITLE"
            else
              echo "ℹ️ 변경 사항 없음 — 빈 커밋 생성"
              git commit --allow-empty -m "feat: [FLASH] $TITLE (no changes)"
            fi
          fi

      # 8. 브랜치 푸시
      - name: Push branch
        if: steps.parse.outputs.no_task != 'true'
        run: git push origin "$branch" --force

      # 9. PR 생성
      - name: Create Pull Request
        if: steps.parse.outputs.no_task != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # PR 본문 파일 생성 (이스케이프 완전 차단)
          cat > pr_body.txt << EOF
          ## NightWatch 자율 태스크

          **태그:** \`${{ steps.parse.outputs.tag }}\`
          **모델:** \`${{ steps.parse.outputs.model }}\`

          ### 태스크 내용
          $(cat task_body.txt)

          ---
          > 🤖 NightWatch Bot이 자동 생성한 PR입니다.
          EOF

          gh pr create \
            --title "[${{ steps.parse.outputs.tag }}] ${{ steps.parse.outputs.title }}" \
            --body-file pr_body.txt \
            --base main \
            --head "$branch" || echo "이미 PR이 존재하거나 생성 실패 (무시)"

      # 10. Discord 성공 알림
      - name: Discord success notification
        if: success() && steps.parse.outputs.no_task != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **NightWatch PR 생성 완료** — 아침에 검토해주세요!\n→ 태스크: \`${{ steps.parse.outputs.title }}\`\n→ 모델: \`${{ steps.parse.outputs.model }}\`\"}"

      # 11. 실패 시 Discord 알림
      - name: Discord failure notification
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **NightWatch 야간 루프 실패** — 인간 개입 필요!\n→ 태스크: \`${{ steps.parse.outputs.title }}\`\"}"
