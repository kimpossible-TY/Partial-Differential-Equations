name: ci-fixer
description: CI diagnostic and repair specialist.
version: 1.0.0
capabilities:
  filesystem:
    read:
      - "../../**/*"
    write:
      - "../../**/*"
  shell:
    allow:
      - "python3"
      - "pip"
      - "git"
      - "pytest"
      - "mypy"
      - "flake8"
      - "typst"
