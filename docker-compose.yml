# ==============================================================================
# Project NightWatch — docker-compose.yml (Unified Version)
# ==============================================================================

services:
  # 🏢 OpenClaw Main Office (Gateway + Local Agents)
  openclaw-gateway:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.nightwatch
      args:
        - OPENCLAW_VER=${OC_VERSION:-latest}
    container_name: openclaw-gateway
    # 게이트웨이를 로컬 신뢰 모드로 실행 (토큰 없이 로컬 접속 허용)
    command: openclaw gateway run --port 18789 --allow-unconfigured
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
      - ./.openclaw:/workspace/.openclaw:rw
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.env:/workspace/.env:ro               
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_WORKSPACE=/workspace
      - OPENCLAW_ACCEPT_RISK=true
      - HOST=0.0.0.0
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_CONFIG_PATH=${OPENCLAW_CONFIG_PATH:-/workspace/.openclaw/openclaw.json}
      - OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR:-/workspace/.openclaw}
    network_mode: host
    restart: unless-stopped

  # 💻 CI & One-off Task Worker (CI 스크립트 호환용)
  nightwatch-agent:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    container_name: nightwatch-agent
    depends_on:
      - openclaw-gateway
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
      - ./.openclaw:/root/.openclaw:rw
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_GATEWAY_URL=ws://127.0.0.1:18789
      - OPENCLAW_WORKSPACE=/workspace
      - OPENCLAW_ACCEPT_RISK=true
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_CONFIG_PATH=${OPENCLAW_CONFIG_PATH:-/workspace/.openclaw/openclaw.json}
      - OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR:-/workspace/.openclaw}
    working_dir: /workspace
    network_mode: host
    # CI 환경에서는 외부에서 명령어를 주입받지만, 로컬에서는 전문가들을 상시 출근시킴
    command: [ "sh", "-c", "echo '🚀 Nightwatch CI/CD Agent is standing by...'; tail -f /dev/null" ]
