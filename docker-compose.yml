# ==============================================================================
# Project NightWatch — docker-compose.yml
# OrbStack(Docker 호환)으로 실행. tests/ 볼륨은 ro(read-only) — 절대 규칙.
# ==============================================================================

services:
  # OpenClaw Gateway Service (Stable Connection)
  openclaw-gateway:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    container_name: openclaw-gateway
    command: >
      /bin/bash -c "openclaw setup --workspace /workspace --non-interactive && 
                    openclaw agents add /workspace/agents/tool-architect && 
                    openclaw gateway run --bind lan --port 18789 --auth none"
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_WORKSPACE=/workspace
    network_mode: bridge
    ports:
      - "18789:18789"

  nightwatch-agent:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.nightwatch
    container_name: nightwatch-agent
    depends_on:
      - openclaw-gateway
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_GATEWAY_URL=ws://openclaw-gateway:18789
      - OPENCLAW_WORKSPACE=/workspace
    working_dir: /workspace
    network_mode: bridge
