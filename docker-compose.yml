# ==============================================================================
# Project NightWatch — docker-compose.yml
# OrbStack(Docker 호환)으로 실행. tests/ 볼륨은 ro(read-only) — 절대 규칙.
# ==============================================================================

services:
  # OpenClaw Gateway Service (Stable Connection)
  openclaw-gateway:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    container_name: openclaw-gateway
    command: openclaw gateway run --bind lan --port 18789 --auth token --token ${GATEWAY_TOKEN}
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
      - ./.openclaw_config:/root/.openclaw:rw
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_WORKSPACE=/workspace
      - OPENCLAW_ACCEPT_RISK=true
    network_mode: bridge
    ports:
      - "18789:18789"

  nightwatch-agent:
    image: ghcr.io/kimpossible-ty/partial-differential-equations/nightwatch-agent:latest
    container_name: nightwatch-agent
    depends_on:
      - openclaw-gateway
    volumes:
      - .:/workspace:rw
      - ./tests:/workspace/tests:ro
      - ./.openclaw_config:/root/.openclaw:rw
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_GATEWAY_URL=ws://openclaw-gateway:18789
      - OPENCLAW_WORKSPACE=/workspace
      - OPENCLAW_ACCEPT_RISK=true
    working_dir: /workspace
    network_mode: bridge
